\* Current design: the wait registration transaction re-checks pending
\* inside itself, so the check/register gap is closed. With reliable
\* eager delivery (ScanCanMiss = FALSE) no sweep is needed.
\* Expected TLC result: no errors.
CONSTANTS
    AtomicReg   = TRUE
    ScanCanMiss = FALSE
    Sweep       = FALSE
SPECIFICATION Spec
INVARIANTS NoMissedWakeup
