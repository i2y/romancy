\* Pre-fix protocol: a claim can never be taken over. A consumer that
\* claims and dies leaves the message claimed forever — hidden from every
\* other consumer (orphan claim).
\* Expected TLC result: liveness violation (ConsumedEventually fails) and
\* a reachable state where nothing alive can claim.
CONSTANTS
    Consumers = {c1, c2}
    Takeover  = FALSE
SPECIFICATION Spec
INVARIANTS AtMostOneConsume
PROPERTIES ConsumedEventually
