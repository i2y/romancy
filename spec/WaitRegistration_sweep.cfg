\* Full deployment: atomic registration plus the periodic
\* RequeueChannelWaitsWithPending sweep. Even when the publisher's scan
\* misses an uncommitted wait, a fair sweep still delivers the message.
\* Expected TLC result: liveness holds (the transient stranded state is
\* healed; NoMissedWakeup does not apply while a sweep exists).
CONSTANTS
    AtomicReg   = TRUE
    ScanCanMiss = TRUE
    Sweep       = TRUE
SPECIFICATION FairSpec
PROPERTY PendingLeadsToReceived
