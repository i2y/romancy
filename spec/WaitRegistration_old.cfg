\* Pre-fix design: pending check and wait registration are separate steps
\* (and the registration itself was three autocommit statements).
\* Expected TLC result: INVARIANT violation -- a publish lands in the
\* check/register gap; the scan sees no waiter and R is stranded waiting on
\* a committed message (missed wakeup).
CONSTANTS
    AtomicReg   = FALSE
    ScanCanMiss = FALSE
    Sweep       = FALSE
SPECIFICATION Spec
INVARIANTS NoMissedWakeup
