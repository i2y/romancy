\* Honest residual: the atomic registration cannot prevent a publisher's
\* waiter scan from running before the registration commits under
\* read-committed isolation (ScanCanMiss = TRUE). Without a backstop the
\* stranded state is still reachable, just far narrower.
\* Expected TLC result: INVARIANT violation -- this is why the sweep exists.
CONSTANTS
    AtomicReg   = TRUE
    ScanCanMiss = TRUE
    Sweep       = FALSE
SPECIFICATION Spec
INVARIANTS NoMissedWakeup
