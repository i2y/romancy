\* Pre-fix design: non-atomic claim, unfenced writes.
\* Expected TLC result: INVARIANT violation -- the counterexample is either
\* the claim race (two workers pass the stale read, both run, the non-holder
\* writes) or lease expiry without fencing.
CONSTANTS
    Workers     = {w1, w2}
    NULL        = NULL
    AtomicClaim = FALSE
    Fenced      = FALSE
SPECIFICATION Spec
INVARIANTS NoStaleWrite LegitimateWriters
